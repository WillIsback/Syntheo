# Dependabot — mises à jour automatisées des dépendances (versions épinglées)
---
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    # Les familles qui doivent monter ensemble passent avant le groupe minor/patch
    # (Dependabot range une dépendance dans le premier groupe qui la couvre).
    groups:
      ai-sdk:
        patterns: [
          "ai",
          "@ai-sdk/*",
        ] # LanguageModelV3/V4 : une seule version pour toute la famille
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # Avis sans version corrigée publiée ou bloqués par une contrainte amont.
    # Voir .github/security-exceptions.yml (expire le 2027-01-31).
    ignore:
      - dependency-name: "zod"
        versions: ["3.x"] # correctif uniquement en 4.x, tiré par des tiers
      - dependency-name: "@lobehub/icons"
        update-types: [
          "version-update:semver-major",
        ] # 6.x exige @lobehub/ui 6, le dépôt est sur @lobehub/ui 3.4

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      windows:
        patterns: ["windows", "windows-core"] # windows-core doit suivre windows
      askama:
        patterns: ["askama", "askama_parser"]
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    # glib 0.18 est imposé par gtk3-rs / webkit2gtk-4.1 (Tauri).
    # Voir .github/security-exceptions.yml (expire le 2027-01-31).
    ignore:
      - dependency-name: "glib"
        versions: [
          ">= 0.19",
        ] # gtk3-rs s'arrête à 0.18 ; notification-linux doit rester aligné
      - dependency-name: "earshot"
        update-types: [
          "version-update:semver-major",
        ] # 1.x impose des trames de 256 échantillons, incompatible avec le wrapper vad 10/20/30 ms
      - dependency-name: "minijinja-contrib"
        update-types: [
          "version-update:semver-major",
        ] # 3.x exige minijinja 3 ; bumper les deux ensemble
      - dependency-name: "ort"
        # Épinglé sur 2.0.0-rc.10 : rc.15 casse `onnx` (API changée). À monter à la main.
      - dependency-name: "libsqlite3-sys"
        # Suit sqlx : un seul lien « sqlite3 » dans le graphe, sqlx 0.9.0 est borné à < 0.38.
      - dependency-name: "cidre"
        update-types: [
          "version-update:semver-major",
          "version-update:semver-minor",
        ] # macOS seulement, compilé ni par la CI ni par la release : bump non vérifiable

  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 10
    # Une seule PR pour toutes les actions (épinglées par SHA dans plusieurs fichiers).
    groups:
      github-actions:
        patterns: ["*"]
