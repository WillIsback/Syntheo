# Workflow : build-devtools
# Construit à la demande la variante devtools de l'app (inspecteur WebKit,
# barre de diagnostic, texte des messages console dans app.log) pour les tests
# en conditions réelles : AppImage Linux et installeur Windows, non signés, en
# artefacts du run (14 jours). Ne publie rien.
#
# Lancement : gh workflow run build-devtools --ref v0.5.3 -f version=0.5.3
name: build-devtools

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version injectée dans le bundle (ex. 0.5.3)"
        type: string
        required: false
        default: "0.0.0"

concurrency:
  group: build-devtools-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Build devtools Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système Tauri
        uses: ./.github/actions/install_desktop_deps

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install

      - name: Cache du compilateur (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Injecter la version dans la configuration Syntheo
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CONF=apps/desktop/src-tauri/tauri.conf.syntheo.json
          jq --arg v "${VERSION#v}" '.version = $v' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"

      - name: Build AppImage devtools
        env:
          # Valeur factice exigée par des intégrations cloud héritées (chantier 04d).
          VITE_API_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail
          pnpm -F ui build
          pnpm -F desktop tauri build --ci --bundles appimage --features devtools \
            --config ./src-tauri/tauri.conf.syntheo.json

      - name: Rassembler l'AppImage et sa somme de contrôle
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls target/release/bundle/appimage/*.AppImage apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1)
          test -n "$src"
          cp "$src" "dist/Syntheo-${VERSION#v}-devtools-linux-x86_64.AppImage"
          (cd dist && sha256sum ./*.AppImage > SHA256SUMS-devtools-linux)
          cat dist/SHA256SUMS-devtools-linux

      - name: Upload de l'AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntheo-devtools-linux
          path: dist/
          retention-days: 14

  windows:
    name: Build devtools Windows
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version }}
      features: devtools
      artifact-name: syntheo-devtools-windows
