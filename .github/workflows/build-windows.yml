# Workflow : build-windows
# Compilation des paquets Windows (NSIS + MSI).
#
# Règle de signature : on ne signe QUE les builds de release.
# La signature Azure Artifact Signing (quota mensuel limité) ne s'active que si
# toutes ces conditions sont réunies :
#   1. `inputs.features` est vide : build de release. Toute feature (ex.
#      `devtools`) donne un build de test, jamais signé ;
#   2. le workflow est appelé par release.yml depuis main (jamais par un
#      lancement manuel de ce workflow, ni depuis une autre branche) ;
#   3. les secrets Azure sont transmis explicitement par release.yml.
# La compilation (dépendances, build.rs, Vite) tourne sans aucun identifiant.
# Seule l'étape qui assemble et signe les installeurs reçoit les identifiants
# Azure. Sinon, build non signé. Cette isolation est par étape, dans le même
# job que la compilation : elle ne vaut pas celle d'un job de signature séparé,
# suivi dans #663. Voir docs/fr/desktop-installation.mdx.
name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version injectée dans le bundle"
        type: string
        required: false
        default: "0.0.0"
      features:
        description: "Features Cargo de l'app (ex. devtools), vide pour la version publiée"
        type: string
        required: false
        default: ""
  workflow_call:
    # Transmis un par un par release.yml (pas de `secrets: inherit`), lus par la
    # seule étape de signature.
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
    inputs:
      version:
        description: "Version injectée dans le bundle"
        type: string
        required: true
      features:
        description: "Features Cargo de l'app (ex. devtools), vide pour la version publiée"
        type: string
        required: false
        default: ""
      artifact-name:
        description: "Nom de l'artefact des installeurs"
        type: string
        required: false
        default: "syntheo-desktop-windows"
    outputs:
      signed:
        description: "true si les installeurs sont signés et leur signature vérifiée"
        value: ${{ jobs.build.outputs.signed }}

concurrency:
  group: build-windows-${{ github.ref }}-${{ inputs.features }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      signed: ${{ steps.verify.outputs.signed || 'false' }}
    # Paquets signés : compilés de zéro, sans cache de compilation (sccache)
    # ni registre Cargo restauré depuis le cache Actions, que d'autres
    # exécutions sur main alimentent aussi.
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install
        with:
          cache: "false"

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Injecter la version dans la configuration Syntheo
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $conf = "apps/desktop/src-tauri/tauri.conf.syntheo.json"
          $json = Get-Content -Raw $conf | ConvertFrom-Json
          $version = if ($env:VERSION) { $env:VERSION -replace '^v', '' } else { "0.0.0" }
          $json | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $json | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $conf

      # Runtime Visual C++ embarqué à côté de syntheo.exe (déploiement local à
      # l'application) : l'exe est lié au CRT dynamique (`-crt-static`, imposé
      # par les binaires statiques d'ONNX Runtime compilés en /MD) et importe
      # MSVCP140*.dll / VCRUNTIME140*.dll, absents d'un Windows neuf (#313).
      - name: Copier le runtime Visual C++ (Microsoft.VC143.CRT)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio (outils VC x64) introuvable" }
          $redist = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName "x64\Microsoft.VC143.CRT")) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $redist) { throw "Dossier VC\Redist\MSVC\<version>\x64\Microsoft.VC143.CRT introuvable" }
          $crt = Join-Path $redist.FullName "x64\Microsoft.VC143.CRT"
          $dest = "apps/desktop/src-tauri/vcrt"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll") {
            Copy-Item (Join-Path $crt $dll) $dest -ErrorAction Stop
            $v = (Get-Item (Join-Path $dest $dll)).VersionInfo.FileVersion
            Write-Host "$dll $v (depuis $crt)"
          }
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe") |
            Sort-Object FullName -Descending | Select-Object -First 1
          "DUMPBIN=$($dumpbin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Décision unique de signature, appliquée par les étapes suivantes. Seul
      # un booléen sort de cette étape : aucun secret n'y est lu en clair.
      - name: Décider de la signature (release depuis main uniquement)
        id: signing
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
          REF: ${{ github.ref }}
          CALLER: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
          HAS_AZURE_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
        run: |
          set -euo pipefail
          if [ -n "${FEATURES:-}" ]; then
            echo "Build avec features ($FEATURES) : build de test, signature désactivée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$REF" != "refs/heads/main" ] || [ "$CALLER" != "$RELEASE_WORKFLOW" ]; then
            echo "Hors release depuis main ($CALLER) : signature désactivée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_AZURE_SECRET" != "true" ]; then
            echo "Secrets Azure absents : signature désactivée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release depuis main avec secrets Azure : signature activée."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer artifact-signing-cli
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $version = "0.12.0"
          # Somme SHA-256 du binaire publié (vérifiée comme les autres outils de CI).
          $sha256 = "dd6fa95a0367cbd32ea520037c3df72d1ed8f523a5b07883b0c2a4034e918a53"
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing-cli"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $exe = Join-Path $dir "artifact-signing-cli.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Levminer/artifact-signing-cli/releases/download/$version/artifact-signing-cli.exe" -OutFile $exe
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($actual -ne $sha256) { throw "SHA256 invalide pour artifact-signing-cli : $actual" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      # Compilation sans aucun identifiant : le code des dépendances (build.rs,
      # proc-macros, plugins Vite) ne voit jamais les secrets Azure.
      - name: Compiler l'application (sans signature)
        shell: bash
        env:
          # Valeur factice exigée par des intégrations cloud héritées (chantier 04d).
          VITE_API_URL: http://127.0.0.1:9
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${FEATURES:-}" ]; then
            echo "Features : $FEATURES"
            extra+=(--features "$FEATURES")
          fi
          pnpm -F ui build
          pnpm -F desktop tauri build --ci --no-bundle \
            --config ./src-tauri/tauri.conf.syntheo.json \
            --config ./src-tauri/tauri.windows-vcrt.conf.json "${extra[@]}"

      - name: Assembler les installeurs MSI et NSIS (non signés)
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${FEATURES:-}" ]; then
            extra+=(--features "$FEATURES")
          fi
          pnpm -F desktop tauri bundle --ci --bundles nsis,msi \
            --config ./src-tauri/tauri.conf.syntheo.json \
            --config ./src-tauri/tauri.windows-vcrt.conf.json "${extra[@]}"

      # Seule étape qui reçoit les identifiants Azure : elle n'exécute que
      # l'assemblage des installeurs (aucune compilation) et l'outil de
      # signature, qui signe l'exécutable, le programme de désinstallation et
      # les installeurs. Session Azure fermée en sortie.
      # Passage à OIDC (identité fédérée, sans secret client) : remplacer les
      # trois variables par une étape azure/login avec `id-token: write`, une
      # fois l'identité fédérée configurée côté Entra ID.
      - name: Assembler et signer les installeurs (release)
        id: build
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          trap 'az logout --only-show-errors > /dev/null 2>&1 || true' EXIT
          if ! az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" \
            -t "$AZURE_TENANT_ID" --only-show-errors > /dev/null; then
            echo "::error::az login a échoué. Si le message est « No subscriptions found », attribue le rôle Reader au service principal sur le groupe de ressources du compte Artifact Signing (ou sur l'abonnement)."
            exit 1
          fi
          echo "Authentification Azure OK."
          echo "signing=true" >> "$GITHUB_OUTPUT"
          pnpm -F desktop tauri bundle --ci --bundles nsis,msi \
            --config ./src-tauri/tauri.conf.syntheo.json \
            --config ./src-tauri/tauri.windows-vcrt.conf.json \
            --config ./src-tauri/tauri.windows-signing.conf.json

      - name: Vérifier que le runtime Visual C++ importé est embarqué
        shell: pwsh
        run: |
          # Toute DLL du runtime Visual C++ importée par syntheo.exe doit faire
          # partie de celles embarquées (tauri.windows-vcrt.conf.json).
          $exe = Get-ChildItem -Path apps/desktop/src-tauri/target/release/syntheo.exe, target/release/syntheo.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "syntheo.exe introuvable" }
          $imports = & $env:DUMPBIN /nologo /dependents $exe.FullName |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          Write-Host "Imports de $($exe.FullName) :"
          $imports | ForEach-Object { Write-Host "  $_" }
          $embedded = Get-ChildItem apps/desktop/src-tauri/vcrt -Filter *.dll | ForEach-Object { $_.Name.ToLower() }
          $missing = $imports | Where-Object { $_ -match '^(msvcp|vcruntime|concrt|vccorlib|vcomp)' -and $_.ToLower() -notin $embedded }
          if ($missing) { throw "DLL du runtime Visual C++ importées mais non embarquées : $($missing -join ', ')" }

      - name: Vérifier la signature des installeurs
        id: verify
        if: steps.build.outputs.signing == 'true'
        shell: pwsh
        run: |
          # `Get-AuthenticodeSignature` renvoie `UnknownError` quand la racine de
          # confiance d'Artifact Signing n'est pas (encore) dans le magasin du
          # runner : la chaîne ne se construit pas, mais la signature reste
          # valide. On vérifie donc le signataire et l'horodatage, en acceptant
          # `UnknownError` à côté de `Valid`.
          $files = @(
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          )
          $failed = $false
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { "aucun" }
            Write-Host "$($file.Name) : status=$($sig.Status) ; horodate=$([bool]$sig.TimeStamperCertificate) ; signataire=$subject"
            if (-not $sig.SignerCertificate) {
              Write-Host "  -> aucun signataire"
              $failed = $true
            } elseif ($sig.Status -notin @("Valid", "UnknownError")) {
              Write-Host "  -> statut inattendu"
              $failed = $true
            } elseif (-not $sig.TimeStamperCertificate) {
              Write-Host "  -> signature non horodatée"
              $failed = $true
            }
          }
          if ($failed) { throw "au moins un installeur n'est pas signé correctement" }
          # Lue par release.yml : une release publiée exige des installeurs signés.
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Rassembler les artefacts et les sommes de contrôle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows
          Get-Content dist/SHA256SUMS-windows

      - name: Upload des artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name || 'syntheo-desktop-windows' }}
          path: dist/
          retention-days: 14
