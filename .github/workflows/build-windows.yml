# Workflow : build-windows
# Compilation des paquets Windows (NSIS + MSI), puis signature Authenticode
# pour une release (issue 663).
#
# Règle de signature : on ne signe QUE les builds de release.
# La signature Azure Artifact Signing (quota mensuel limité) n'a lieu que si
# toutes ces conditions sont réunies :
#   1. `inputs.features` est vide : build de release. Toute feature (ex.
#      `devtools`) donne un build de test, jamais signé ;
#   2. le workflow est appelé par release.yml depuis main (jamais par un
#      lancement manuel de ce workflow, ni depuis une autre branche) ;
#   3. ce n'est pas un lancement à blanc (`dry-run`) de release.yml.
#
# Deux jobs :
#   - `build` compile et vérifie, sans aucun identifiant. Hors release, il
#     assemble les installeurs non signés et les publie en artefact. Pour une
#     release, il ne publie que l'exécutable et le runtime Visual C++ ;
#   - `sign`, pour une release seulement, dans l'environnement
#     `windows-signing` (limité à main) : il n'installe aucune dépendance du
#     projet, seulement la CLI Tauri figée de .github/signing et le client
#     Artifact Signing à empreinte figée. Il se connecte à Azure par identité
#     fédérée (OIDC, `id-token: write` limité à ce job), sans secret client,
#     assemble les installeurs en signant l'exécutable, le programme de
#     désinstallation et les installeurs, puis vérifie le signataire attendu.
# Voir docs/fr/desktop-installation.mdx et CONTRIBUTING.md.
name: build-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version injectée dans le bundle"
        type: string
        required: false
        default: "0.0.0"
      features:
        description: "Features Cargo de l'app (ex. devtools), vide pour la version publiée"
        type: string
        required: false
        default: ""
  workflow_call:
    # Identifiants (non secrets) de l'identité fédérée, rangés dans
    # l'environnement `windows-signing` et lus par le seul job sign. Un workflow
    # réutilisable ne lit un secret d'environnement que si l'appelant le passe
    # par son nom : c'est alors la valeur de l'environnement qui est utilisée.
    secrets:
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
    inputs:
      version:
        description: "Version injectée dans le bundle"
        type: string
        required: true
      features:
        description: "Features Cargo de l'app (ex. devtools), vide pour la version publiée"
        type: string
        required: false
        default: ""
      dry-run:
        description: "Lancement à blanc de release.yml : aucune signature"
        type: boolean
        required: false
        default: false
      artifact-name:
        description: "Nom de l'artefact des installeurs"
        type: string
        required: false
        default: "syntheo-desktop-windows"
    outputs:
      signed:
        description: "true si les installeurs sont signés et leur signature vérifiée"
        value: ${{ jobs.sign.outputs.signed }}

concurrency:
  group: build-windows-${{ github.ref }}-${{ inputs.features }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      sign: ${{ steps.signing.outputs.enabled }}
    # Paquets de release : compilés de zéro, sans cache de compilation
    # (sccache) ni registre Cargo restauré depuis le cache Actions, que d'autres
    # exécutions sur main alimentent aussi.
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install
        with:
          cache: "false"

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Injecter la version dans la configuration Syntheo
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $conf = "apps/desktop/src-tauri/tauri.conf.syntheo.json"
          $json = Get-Content -Raw $conf | ConvertFrom-Json
          $version = if ($env:VERSION) { $env:VERSION -replace '^v', '' } else { "0.0.0" }
          $json | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $json | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $conf

      # Runtime Visual C++ embarqué à côté de syntheo.exe (déploiement local à
      # l'application) : l'exe est lié au CRT dynamique (`-crt-static`, imposé
      # par les binaires statiques d'ONNX Runtime compilés en /MD) et importe
      # MSVCP140*.dll / VCRUNTIME140*.dll, absents d'un Windows neuf (#313).
      - name: Copier le runtime Visual C++ (Microsoft.VC143.CRT)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio (outils VC x64) introuvable" }
          $redist = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' -and (Test-Path (Join-Path $_.FullName "x64\Microsoft.VC143.CRT")) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $redist) { throw "Dossier VC\Redist\MSVC\<version>\x64\Microsoft.VC143.CRT introuvable" }
          $crt = Join-Path $redist.FullName "x64\Microsoft.VC143.CRT"
          $dest = "apps/desktop/src-tauri/vcrt"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "msvcp140_1.dll") {
            Copy-Item (Join-Path $crt $dll) $dest -ErrorAction Stop
            $v = (Get-Item (Join-Path $dest $dll)).VersionInfo.FileVersion
            Write-Host "$dll $v (depuis $crt)"
          }
          $dumpbin = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe") |
            Sort-Object FullName -Descending | Select-Object -First 1
          "DUMPBIN=$($dumpbin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Programme compagnon syntheo-speech (issue 683) : construit avant la
      # compilation de l'application, qui l'embarque (externalBin) et en
      # épingle l'empreinte, stable à la signature Authenticode. ONNX Runtime
      # épinglé et contrôlé ; DLL importées contrôlées (dumpbin).
      - name: Construire syntheo-speech et ses licences
        shell: pwsh
        env:
          ORT_CACHE_DIR: ${{ runner.temp }}\ort-cache
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          if ($LASTEXITCODE -ne 0) { throw "cargo install cargo-about a échoué" }
          ./scripts/build-speech.ps1 -Dumpbin $env:DUMPBIN
          if (-not (Test-Path apps/desktop/src-tauri/speech-licenses/THIRD-PARTY-RUST.html)) { throw "THIRD-PARTY-RUST.html absent" }

      # Décision unique de signature : seul un booléen sort de cette étape.
      - name: Décider de la signature (release depuis main uniquement)
        id: signing
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
          DRY_RUN: ${{ inputs.dry-run }}
          REF: ${{ github.ref }}
          CALLER: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml@refs/heads/main
        run: |
          set -euo pipefail
          if [ -n "${FEATURES:-}" ]; then
            echo "Build avec features ($FEATURES) : build de test, signature désactivée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$REF" != "refs/heads/main" ] || [ "$CALLER" != "$RELEASE_WORKFLOW" ]; then
            echo "Hors release depuis main ($CALLER) : signature désactivée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Lancement à blanc de release.yml : signature désactivée."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release depuis main : signature par le job sign."
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Compilation : ce job n'a aucun identifiant Azure.
      - name: Compiler l'application (sans signature)
        shell: bash
        env:
          # Valeur factice exigée par des intégrations cloud héritées (chantier 04d).
          VITE_API_URL: http://127.0.0.1:9
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${FEATURES:-}" ]; then
            echo "Features : $FEATURES"
            extra+=(--features "$FEATURES")
          fi
          pnpm -F ui build
          pnpm -F desktop tauri build --ci --no-bundle \
            --config ./src-tauri/tauri.conf.syntheo.json \
            --config ./src-tauri/tauri.windows-vcrt.conf.json \
            --config ./src-tauri/tauri.speech.conf.json "${extra[@]}"

      - name: Assembler les installeurs MSI et NSIS (non signés)
        if: steps.signing.outputs.enabled != 'true'
        shell: bash
        env:
          FEATURES: ${{ inputs.features }}
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${FEATURES:-}" ]; then
            extra+=(--features "$FEATURES")
          fi
          pnpm -F desktop tauri bundle --ci --bundles nsis,msi \
            --config ./src-tauri/tauri.conf.syntheo.json \
            --config ./src-tauri/tauri.windows-vcrt.conf.json \
            --config ./src-tauri/tauri.speech.conf.json "${extra[@]}"

      - name: Vérifier que le runtime Visual C++ importé est embarqué
        shell: pwsh
        run: |
          # Toute DLL du runtime Visual C++ importée par syntheo.exe doit faire
          # partie de celles embarquées (tauri.windows-vcrt.conf.json).
          $exe = Get-ChildItem -Path apps/desktop/src-tauri/target/release/syntheo.exe, target/release/syntheo.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { throw "syntheo.exe introuvable" }
          $imports = & $env:DUMPBIN /nologo /dependents $exe.FullName |
            ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.dll$' }
          Write-Host "Imports de $($exe.FullName) :"
          $imports | ForEach-Object { Write-Host "  $_" }
          $embedded = Get-ChildItem apps/desktop/src-tauri/vcrt -Filter *.dll | ForEach-Object { $_.Name.ToLower() }
          $missing = $imports | Where-Object { $_ -match '^(msvcp|vcruntime|concrt|vccorlib|vcomp)' -and $_.ToLower() -notin $embedded }
          if ($missing) { throw "DLL du runtime Visual C++ importées mais non embarquées : $($missing -join ', ')" }

      # Release : seuls l'exécutable compilé et le runtime Visual C++ passent au
      # job de signature, qui assemble les installeurs.
      - name: Préparer les fichiers à signer (release)
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path signing-input/vcrt, signing-input/binaries | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/syntheo.exe signing-input/ -ErrorAction Stop
          Copy-Item apps/desktop/src-tauri/vcrt/*.dll signing-input/vcrt/ -ErrorAction Stop
          Copy-Item apps/desktop/src-tauri/binaries/syntheo-speech-x86_64-pc-windows-msvc.exe signing-input/binaries/ -ErrorAction Stop
          Copy-Item apps/desktop/src-tauri/speech-licenses signing-input/speech-licenses -Recurse -ErrorAction Stop
          Get-ChildItem -Recurse signing-input -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.FullName)"
          }

      - name: Upload des fichiers à signer (release)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntheo-desktop-windows-unsigned
          path: signing-input/
          retention-days: 1

      - name: Rassembler les artefacts et les sommes de contrôle
        if: steps.signing.outputs.enabled != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows
          Get-Content dist/SHA256SUMS-windows

      - name: Upload des artefacts
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name || 'syntheo-desktop-windows' }}
          path: dist/
          retention-days: 14

  # Signature Authenticode, pour une release seulement. Aucune dépendance du
  # projet : la CLI Tauri (version et empreintes figées de .github/signing,
  # comme le job de signature des mises à jour) et le client Artifact Signing
  # (paquet NuGet à empreinte figée). Connexion Azure par OIDC, sans secret.
  sign:
    name: Signature Windows (release)
    needs: build
    if: needs.build.outputs.sign == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: windows-signing
    permissions:
      contents: read # checkout du dépôt
      id-token: write # jeton OIDC pour azure/login, sans secret client
    outputs:
      signed: ${{ steps.verify.outputs.signed || 'false' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      # Version exacte et empreintes sha512 du package-lock.json dédié,
      # vérifiées par npm ci ; aucun script d'installation n'est exécuté.
      - name: Installer la CLI Tauri (version et empreintes figées)
        working-directory: .github/signing
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Télécharger les fichiers à signer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-windows-unsigned
          path: signing-input

      - name: Placer l'exécutable, le compagnon et le runtime Visual C++
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/target/release, apps/desktop/src-tauri/vcrt, apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item signing-input/syntheo.exe apps/desktop/src-tauri/target/release/ -ErrorAction Stop
          Copy-Item signing-input/vcrt/*.dll apps/desktop/src-tauri/vcrt/ -ErrorAction Stop
          Copy-Item signing-input/binaries/syntheo-speech-x86_64-pc-windows-msvc.exe apps/desktop/src-tauri/binaries/ -ErrorAction Stop
          Copy-Item signing-input/speech-licenses apps/desktop/src-tauri/speech-licenses -Recurse -ErrorAction Stop

      - name: Injecter la version dans la configuration Syntheo
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $conf = "apps/desktop/src-tauri/tauri.conf.syntheo.json"
          $json = Get-Content -Raw $conf | ConvertFrom-Json
          $version = if ($env:VERSION) { $env:VERSION -replace '^v', '' } else { "0.0.0" }
          $json | Add-Member -NotePropertyName version -NotePropertyValue $version -Force
          $json | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $conf

      # Client Artifact Signing (dlib de SignTool), paquet NuGet officiel à
      # version et empreinte figées. Il s'authentifie par DefaultAzureCredential,
      # restreint ici à la session Azure CLI ouverte par azure/login (OIDC).
      - name: Préparer SignTool et le client Artifact Signing
        shell: pwsh
        env:
          ENDPOINT: https://neu.codesigning.azure.net
          ACCOUNT: willisback-signing
          PROFILE: syntheo-public
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $version = "1.0.146"
          $sha256 = "7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70"
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $pkg = Join-Path $dir "client.nupkg"
          Invoke-WebRequest -UseBasicParsing -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" -OutFile $pkg
          $actual = (Get-FileHash -Algorithm SHA256 $pkg).Hash.ToLower()
          if ($actual -ne $sha256) { throw "SHA256 invalide pour Microsoft.ArtifactSigning.Client : $actual" }
          Expand-Archive -Path $pkg -DestinationPath (Join-Path $dir "client") -Force
          $dlib = Join-Path $dir "client\bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll introuvable dans le paquet" }

          # SignTool du SDK Windows le plus récent (le SDK 20348 n'est pas pris
          # en charge par le client Artifact Signing).
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Where-Object { $_.Directory.Parent.Name -match '^\d+\.\d+\.\d+\.\d+$' -and $_.Directory.Parent.Name -notlike '10.0.20348.*' } |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable" }
          Write-Host "SignTool : $($signtool.FullName)"

          $metadata = Join-Path $dir "metadata.json"
          @{
            Endpoint = $env:ENDPOINT
            CodeSigningAccountName = $env:ACCOUNT
            CertificateProfileName = $env:PROFILE
            CorrelationId = "$env:RUN_ID-$env:RUN_ATTEMPT"
            ExcludeCredentials = @(
              "EnvironmentCredential", "WorkloadIdentityCredential", "ManagedIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Set-Content -Encoding utf8 $metadata

          # Commande de signature de Tauri, en notation objet (chemins avec
          # espaces) : appelée pour l'exécutable, le programme de
          # désinstallation et les installeurs.
          $conf = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.conf.json"
          @{
            bundle = @{
              windows = @{
                signCommand = @{
                  cmd = $signtool.FullName
                  args = @("sign", "/v", "/fd", "SHA256", "/tr", "http://timestamp.acs.microsoft.com", "/td", "SHA256", "/dlib", $dlib, "/dmdf", $metadata, "%1")
                }
              }
            }
          } | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 $conf
          "SIGNING_CONF=$conf" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Connexion à Azure (OIDC, sans secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Assembler et signer les installeurs
        id: bundle
        shell: bash
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          trap 'az logout --only-show-errors > /dev/null 2>&1 || true' EXIT
          ../../.github/signing/node_modules/.bin/tauri bundle --ci --bundles nsis,msi \
            --config ./src-tauri/tauri.conf.syntheo.json \
            --config ./src-tauri/tauri.windows-vcrt.conf.json \
            --config ./src-tauri/tauri.speech.conf.json \
            --config "$SIGNING_CONF"

      # Tauri signe le compagnon sur place (binaries/) : son empreinte
      # stable à la signature doit rester celle que syntheo.exe a épinglée
      # à la compilation, sinon l'application refuserait son compagnon.
      - name: Contrôler l'empreinte du compagnon signé
        shell: pwsh
        run: |
          ./scripts/check-companion-pins.ps1 `
            -Exe apps/desktop/src-tauri/target/release/syntheo.exe `
            -Companion apps/desktop/src-tauri/binaries/syntheo-speech-x86_64-pc-windows-msvc.exe `
            -Vcrt apps/desktop/src-tauri/vcrt

      - name: Vérifier la signature des installeurs
        id: verify
        shell: pwsh
        run: |
          # Signataire attendu (certificat Artifact Signing de William Derue,
          # émis par une autorité « Microsoft ID Verified CS ») et horodatage.
          # `Get-AuthenticodeSignature` renvoie `UnknownError` quand la racine
          # d'Artifact Signing n'est pas dans le magasin du runner : la chaîne
          # ne se construit pas, mais la signature reste valide.
          $expectedSubject = @("CN=William Derue", "O=William Derue")
          # Le programme compagnon (issue 683) est signé par le même
          # signataire que syntheo.exe : contrôle bloquant comme les autres.
          # Tauri le signe sur place, dans binaries/, avant de l'embarquer.
          $files = @(
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            Get-Item apps/desktop/src-tauri/target/release/syntheo.exe
            Get-Item apps/desktop/src-tauri/binaries/syntheo-speech-x86_64-pc-windows-msvc.exe
          )
          $failed = $false
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            $cert = $sig.SignerCertificate
            $subject = if ($cert) { $cert.Subject } else { "aucun" }
            $issuer = if ($cert) { $cert.Issuer } else { "aucun" }
            Write-Host "$($file.Name) : status=$($sig.Status) ; horodate=$([bool]$sig.TimeStamperCertificate) ; signataire=$subject ; émetteur=$issuer"
            $parts = $subject -split ',\s*'
            if (-not $cert) {
              Write-Host "  -> aucun signataire"; $failed = $true
            } elseif ($sig.Status -notin @("Valid", "UnknownError")) {
              Write-Host "  -> statut inattendu"; $failed = $true
            } elseif (-not $sig.TimeStamperCertificate) {
              Write-Host "  -> signature non horodatée"; $failed = $true
            } elseif (@($expectedSubject | Where-Object { $_ -notin $parts }).Count -gt 0) {
              Write-Host "  -> signataire inattendu"; $failed = $true
            } elseif ($issuer -notmatch '(^|,\s*)CN=Microsoft ID Verified CS ' -or $issuer -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              Write-Host "  -> émetteur inattendu"; $failed = $true
            }
          }
          if ($failed) { throw "au moins un fichier n'est pas signé par le signataire attendu" }
          # Lue par release.yml : une release publiée exige des installeurs signés.
          "signed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Rassembler les artefacts et les sommes de contrôle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS-windows
          Get-Content dist/SHA256SUMS-windows

      - name: Upload des artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name || 'syntheo-desktop-windows' }}
          path: dist/
          retention-days: 14
