# Workflow : Qualité du code
# Formatage, lint TS/Rust, typage, cohérence des commits, des workflows et des lockfiles
#
# Le job Rust (clippy + tests, ~20 min à froid) ne tourne PAS sur les PR
# humaines : il est déplacé sur `push` vers main (+ hebdo + manuel), comme le
# Rust de CodeQL. Les PR gardent un contrôle Rust quasi gratuit (`cargo
# metadata --locked`, dans le job TypeScript) et le reste de la qualité.
# EXCEPTION : les PR ouvertes par Dependabot exécutent le job Rust complet. Un
# bump de dépendance cassant ne doit pas pouvoir atteindre main sans avoir été
# compilé (cf. la régression qui a cassé le build desktop, corrigée en #178).
# À LA DEMANDE : l'étiquette `ci:rust` sur une PR lance aussi le job Rust
# complet (PR qui touche beaucoup de Rust, correctif avant une release).
# CIBLE WINDOWS : le job léger `rust-windows` lance le clippy de
# `audio-device` pour x86_64-pc-windows-msvc (depuis Linux, sans linker) sur
# les PR qui touchent `crates/audio-device/**` ou `Cargo.lock`, et toujours
# hors PR (voir issue 382).
name: ci-code-quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    # Hebdomadaire : rattrape une régression Rust non détectée en PR.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: ci-code-quality (TypeScript)
    # PR uniquement : sur `push` main, seul le Rust (job ci-dessous) tourne.
    # (Le dprint global du dépôt ne passe pas sans formateur Swift.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      # dprint délègue les .rs à rustfmt : toolchain installée une seule fois
      # avant, sinon chaque appel concurrent de rustup la réinstalle.
      - name: Toolchain Rust (rustfmt pour dprint)
        uses: ./.github/actions/rust_install

      # Sur une PR, seuls les fichiers modifiés sont vérifiés (le code hérité
      # n'est pas entièrement formaté) ; sinon, tout le dépôt. Les .swift
      # sont exclus : `swift format` n'existe pas sur ce runner Linux.
      - name: Formatage (dprint)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ]; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD \
              | { grep -zv '\.swift$' || true; } \
              | xargs -0 --no-run-if-empty pnpm exec dprint check --allow-no-files
          else
            pnpm fmt:check
          fi

      # Code hérité : oxlint (erreurs) sur le desktop, comme la CI d'origine.
      # Code nouveau ou modifié : ESLint complet, limité aux fichiers de la PR.
      - name: Lint (oxlint)
        run: pnpm exec oxlint --quiet --format=github apps/desktop/src/

      - name: Lint (ESLint, fichiers modifiés)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' \
            | xargs -0 --no-run-if-empty pnpm exec eslint --no-warn-ignored

      - name: Typage du desktop (tsc)
        run: |
          set -euo pipefail
          pnpm -F ui build
          pnpm -F desktop typecheck

      # Contrôle Rust quasi gratuit gardé sur la PR : détecte un Cargo.lock
      # désynchronisé. Le clippy et les tests Rust complets tournent hors PR.
      - name: Intégrité du lockfile Cargo
        run: cargo metadata --locked --format-version 1 > /dev/null

  # Job Rust unique : métadonnées, clippy et tests partagent le même target/
  # compilé une seule fois (l'ancien découpage recompilait tout le workspace
  # deux fois, clippy et test étant deux jobs distincts).
  # Hors PR (voir l'en-tête) : c'est le seul job lourd, on le garde sur main,
  # l'hebdo et le déclenchement manuel pour ne pas allonger les PR.
  rust:
    name: ci-code-quality (Rust)
    # Hors PR (voir l'en-tête), sauf les PR Dependabot : un bump de dépendance
    # doit être compilé/testé avant d'atteindre main.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.user.login == 'dependabot[bot]'
      || contains(github.event.pull_request.labels.*.name, 'ci:rust')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système Tauri
        uses: ./.github/actions/install_desktop_deps
        timeout-minutes: 20

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install

      # Cache du compilateur partagé entre jobs et entre runs (backend cache
      # Actions). rust-cache ne conserve que le registre (voir rust_install).
      - name: Cache du compilateur (sccache)
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Intégrité du lockfile Cargo
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          echo "✅ Cargo.lock à jour."

      # Compile le graphe complet du desktop (plugins `detect`/`importer` → ort,
      # `vad` → onnx, adaptateurs…). Un bump de dépendance cassant échoue ici :
      # `cargo metadata` ne voit que le lockfile, le clippy était alors en
      # continue-on-error, et l'étape de tests ne compile qu'un sous-ensemble.
      # C'est exactement ce qui a laissé passer `ort` 2.0.0-rc.15.
      - name: Compilation du graphe desktop (deps incluses)
        run: |
          set -euo pipefail
          cargo check --locked -p desktop
          echo "✅ Le graphe desktop compile."

      # Clippy sur tout le workspace, cibles de test et exemples compris, et
      # bloquant : les erreurs héritées sont corrigées (issue 553). Les crates
      # propres à macOS (tcc, shortcut-macos) ne compilent sous Linux que leur
      # partie portable.
      - name: Lint (cargo clippy)
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets -- -D warnings

      # Crates portant les chantiers Syntheo : templates et prompts, schéma
      # SQLite, adaptateurs STT, capture (règle « aucun audio sur disque »).
      - name: Tests Rust
        run: |
          set -euo pipefail
          cargo test --locked \
            -p template-app -p db-app -p owhisper-client -p listener-core -p storage

  # Clippy de la cible Windows pour `audio-device` (issue 382) : aucune
  # autre CI ne compile cette crate pour Windows, et son code `cfg(windows)`
  # avait dérivé jusqu'à 51 erreurs clippy (issue 369). Job dédié et léger
  # plutôt qu'une étape du job `rust` : ce dernier ne tourne pas sur les PR
  # humaines, et ici seule `audio-device` est vérifiée (≈ 1 min à froid,
  # sans dépendances système ni compilation du reste du workspace).
  # Sur une PR, les étapes lourdes sont sautées si ni `crates/audio-device/**`
  # ni `Cargo.lock` ne changent (le job ne coûte alors que le checkout) ;
  # hors PR (push main, hebdo, manuel), il tourne toujours.
  rust-windows:
    name: ci-code-quality (Rust Windows, audio-device)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet sur une PR seulement, pour comparer à sa base.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          persist-credentials: false

      - name: Détection des chemins modifiés
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Hors PR : clippy Windows exécuté."
          elif git diff --name-only "$BASE_SHA" HEAD -- 'crates/audio-device/' 'Cargo.lock' | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "audio-device ou Cargo.lock modifié : clippy Windows exécuté."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Ni audio-device ni Cargo.lock modifié : clippy Windows sauté."
          fi

      - name: Toolchain Rust (cible Windows)
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/rust_install
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache du compilateur (sccache)
        if: steps.changes.outputs.run == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # `cargo clippy` ne lie rien : la crate `windows` se vérifie depuis Linux
      # sans compilateur C ni linker MSVC. Bloquant.
      - name: Lint (cargo clippy, x86_64-pc-windows-msvc)
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          cargo clippy --locked --target x86_64-pc-windows-msvc -p audio-device \
            --all-targets -- -D warnings

  meta:
    name: ci-code-quality (PR et workflows)
    # PR uniquement : titre de PR, actionlint, zizmor.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint du titre de PR (Conventional Commits)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "❌ Le titre de la PR ne respecte pas Conventional Commits."
            echo "   Titre : $PR_TITLE"
            echo "   Exemples valides : feat: ..., fix(stt): ..., feat!: ..., chore: ..."
            exit 1
          fi
          echo "✅ Titre de PR valide."

      - name: Lint des workflows GitHub (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          # Binaire épinglé (v1.7.12) et vérifié par empreinte SHA-256.
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          TEMP_DIR=$(mktemp -d)
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$TEMP_DIR/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $TEMP_DIR/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$TEMP_DIR/actionlint.tar.gz" -C "$TEMP_DIR"
          "$TEMP_DIR/actionlint" -color -shellcheck=-
          rm -rf "$TEMP_DIR"

      - name: Installer uv (pour zizmor)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.1"

      - name: Analyse de sécurité des workflows (zizmor)
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Bloquant à partir de la sévérité « high » ; les constats justifiés
          # sont listés dans .github/zizmor.yml.
          uvx --no-build zizmor@1.31.0 --min-severity high --format sarif .github/workflows .github/actions > zizmor.sarif

      - name: Upload SARIF zizmor
        if: ${{ always() && hashFiles('zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: zizmor.sarif
          category: "zizmor"

      - name: Échouer si zizmor signale un problème de sévérité élevée
        if: steps.zizmor.outcome == 'failure'
        shell: bash
        run: |
          echo "❌ zizmor a signalé au moins un problème de sévérité « high »."
          exit 1
