# Workflow : fusion automatique des PR Dependabot
#
# Seules les PR **groupées minor/patch** (groupes `npm-minor-patch`,
# `cargo-minor-patch`, et `github-actions` hors majeure) sont fusionnées
# automatiquement. Une PR isolée est une mise à jour que Dependabot n'a pas
# pu ranger dans ces groupes (majeure, ou 0.x → 0.y, cassante pour cargo) :
# elle reste à relire et à fusionner à la main.
#
# La fusion n'a lieu qu'une fois **tous** les checks terminés, aucun en échec,
# et le job Rust (non requis par le ruleset, ~20 min) vert : un lot de bumps
# cassants a déjà atteint `main` sans être compilé (régression ort rc.15).
name: dependabot-auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    name: Auto-merge Dependabot
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Métadonnées Dependabot
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Décider si la PR est fusionnable automatiquement
        id: policy
        env:
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -euo pipefail
          echo "groupe=${GROUP:-aucun} type=${UPDATE_TYPE:-inconnu}"
          case "$GROUP" in
            npm-minor-patch|cargo-minor-patch)
              ok=true ;;
            github-actions)
              if [ "$UPDATE_TYPE" = "version-update:semver-major" ]; then ok=false; else ok=true; fi ;;
            *)
              ok=false ;;
          esac
          if [ "$ok" != true ]; then
            echo "ℹ️ PR hors des groupes minor/patch : fusion manuelle après relecture."
          fi
          echo "eligible=$ok" >> "$GITHUB_OUTPUT"

      - name: Attendre tous les checks puis fusionner
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          self='Auto-merge Dependabot'
          rust='ci-code-quality (Rust)'
          done=false
          for _ in $(seq 1 160); do
            rc=0
            checks=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket) || rc=$?
            # 8 = des checks sont encore en cours ; tout autre code est une erreur.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 8 ]; then
              echo "❌ lecture des checks impossible (code $rc) : fusion annulée"
              exit 1
            fi
            pending=$(jq --arg self "$self" \
              '[.[] | select(.name != $self and .bucket == "pending")] | length' <<<"$checks")
            rust_state=$(jq -r --arg rust "$rust" \
              '[.[] | select(.name == $rust)][0].bucket // "absent"' <<<"$checks")
            echo "checks en cours : $pending ; job Rust : $rust_state"
            if [ "$pending" = "0" ] && [ "$rust_state" != "absent" ] && [ "$rust_state" != "pending" ]; then
              done=true
              break
            fi
            sleep 30
          done
          if [ "$done" != true ]; then
            echo "❌ délai dépassé en attendant les checks"
            exit 1
          fi

          failing=$(jq --arg self "$self" \
            '[.[] | select(.name != $self and (.bucket == "fail" or .bucket == "cancel"))] | length' <<<"$checks")
          if [ "$failing" != "0" ] || [ "$rust_state" != "pass" ]; then
            echo "❌ checks en échec ou job Rust non vert : fusion annulée"
            jq -r '.[] | "\(.bucket)\t\(.name)"' <<<"$checks"
            exit 1
          fi

          gh pr merge "$PR" --repo "$REPO" --squash
