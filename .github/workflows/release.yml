# Workflow : Release (CD)
# Push sur main ou déclenchement manuel : version semver depuis les commits,
# gates (dont CodeQL Rust, trop long pour les PR), build des paquets Linux,
# SBOM, attestation de provenance, GitHub Release.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de bump (auto = détection automatique)"
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      dry_run:
        description: "Mode dry-run (build depuis main, sans signature de mise à jour ni publication)"
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false # sérialisation stricte

permissions:
  contents: read

jobs:
  detect:
    name: Détection et calcul de version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calc.outputs.version || 'skipped' }}
      bump: ${{ steps.calc.outputs.bump || 'none' }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Calcul de la version
        id: calc
        shell: bash
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Logique partagée avec la gate de PR ci-changelog et preflight.sh
          # (scripts/next-release-version.mjs) : dernier tag + commits
          # feat/fix/perf/! depuis ce tag.
          # `[skip release]` ne bloque que les releases automatiques (push) : un
          # déclenchement manuel (workflow_dispatch) est une intention explicite
          # de publier, on l'honore même si le dernier commit porte le marqueur.
          ARGS=(--bump "${INPUT_BUMP:-auto}")
          if [ "$EVENT_NAME" = "push" ]; then ARGS+=(--honor-skip); fi
          node scripts/next-release-version.mjs "${ARGS[@]}" | tee -a "$GITHUB_OUTPUT"

  gate-version-consistency:
    name: gate-version-consistency
    needs: detect
    if: needs.detect.outputs.version != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Le tag ne doit pas exister et doit être supérieur au dernier
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "❌ Le tag $VERSION existe déjà."; exit 1
          fi
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          HIGHEST=$(printf '%s\n%s\n' "$LAST_TAG" "$VERSION" | sort -V | tail -1)
          [ "$HIGHEST" = "$VERSION" ] && [ "$LAST_TAG" != "$VERSION" ] \
            || { echo "❌ $VERSION n'est pas supérieure à $LAST_TAG."; exit 1; }
          echo "✅ $VERSION > $LAST_TAG"

  build:
    name: Build des paquets Linux
    needs: [detect, gate-version-consistency]
    # Paquets de release : seulement depuis main, y compris en dry_run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Paquets signés : compilés de zéro, sans cache de compilation (sccache)
    # ni registre Cargo restauré depuis le cache Actions, que d'autres
    # exécutions sur main alimentent aussi.
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système Tauri
        uses: ./.github/actions/install_desktop_deps
        timeout-minutes: 20

      - name: Toolchain Rust
        uses: ./.github/actions/rust_install
        with:
          cache: "false"

      - name: Installer Node, pnpm et les dépendances (lockfile figé)
        uses: ./.github/actions/pnpm_install

      - name: Injecter la version dans la configuration Syntheo
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          CONF=apps/desktop/src-tauri/tauri.conf.syntheo.json
          jq --arg v "${VERSION#v}" '.version = $v' "$CONF" > "$CONF.tmp" && mv "$CONF.tmp" "$CONF"

      - name: Build .deb et AppImage
        env:
          # Valeur factice exigée par des intégrations cloud héritées (chantier 04d).
          VITE_API_URL: http://127.0.0.1:9
        run: |
          set -euo pipefail
          pnpm -F ui build
          pnpm -F desktop tauri build --ci --bundles deb,appimage --config ./src-tauri/tauri.conf.syntheo.json

      # Réempaquette l'AppDir : retire Wayland et PipeWire embarqués (ils
      # doivent venir de l'hôte), puis recompresse le squashfs en zstd 19 à
      # blocs de 1 Mio. Doit précéder les sommes de contrôle : SHA256SUMS et
      # l'attestation de provenance (job publish) portent sur l'AppImage finale.
      - name: Réempaqueter l'AppImage (bibliothèques hôte, zstd 19)
        env:
          ARCH: x86_64
        run: node scripts/repack-linux-appimage.mjs apps/desktop/src-tauri/target/release/bundle/appimage

      - name: Rassembler les artefacts et les sommes de contrôle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist/
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/
          (cd dist && sha256sum ./* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: SBOM (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/syntheo-desktop.spdx.json
          upload-artifact: false

      - name: Upload des artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntheo-desktop-linux
          path: dist/
          retention-days: 14

  # Paquets Windows (NSIS + MSI), en parallèle du build Linux. Signés : build
  # de release (sans features) depuis main, avec les secrets Azure transmis.
  # La signature de code est décrite dans docs/fr/desktop-installation.mdx.
  build-windows:
    name: Build des paquets Windows
    needs: [detect, gate-version-consistency]
    if: needs.detect.outputs.version != 'skipped'
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.detect.outputs.version }}
    # Seuls les identifiants de signature, lus par la seule étape qui signe.
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Gate SAST lourde (CodeQL Rust + TypeScript), en parallèle du build.
  sast:
    name: Gate SAST (CodeQL)
    needs: [detect, gate-version-consistency]
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/ci-codeql.yml

  # Mise à jour intégrée (issue 591) : signature des installeurs AppImage et
  # NSIS par la clé Tauri dédiée, puis `latest.json`. Seul job à lire la clé
  # privée. Signe les octets publiés (après Authenticode et réempaquetage de
  # l'AppImage), en dernier.
  # Job minimal : seulement depuis main, jamais en dry_run, dans
  # l'environnement `release-signing` qui détient la clé (branches de
  # déploiement limitées à main ; sans relecteur, mainteneur seul, décision du
  # 2026-11-21). Aucune installation des
  # dépendances du dépôt : seul l'outil de signature est installé, à version et
  # empreintes figées (.github/signing), sans script d'installation.
  updater:
    name: Signatures de mise à jour et latest.json
    needs: [detect, build, build-windows]
    if: |
      needs.detect.outputs.version != 'skipped'
      && github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-signing
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      # Version exacte et empreintes sha512 du package-lock.json dédié
      # (identiques à pnpm-lock.yaml), vérifiées par npm ci ; aucun script
      # d'installation n'est exécuté.
      - name: Installer l'outil de signature (version et empreintes figées)
        working-directory: .github/signing
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Télécharger l'AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-linux
          path: installers

      - name: Télécharger l'installeur NSIS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-windows
          path: installers

      - name: Signer les installeurs (clé de mise à jour Tauri)
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY absent : la release ne peut pas publier de mise à jour intégrée."
            exit 1
          fi
          v="${VERSION#v}"
          mkdir -p updater
          # Formats mis à jour par l'application : AppImage et NSIS. Le .deb et
          # le MSI sont seulement annoncés (lien de téléchargement).
          for file in "Syntheo_${v}_amd64.AppImage" "Syntheo_${v}_x64-setup.exe"; do
            # --app-version lie la signature à la version (requireSignedVersion).
            .github/signing/node_modules/.bin/tauri signer sign --app-version "$v" "$GITHUB_WORKSPACE/installers/$file" > /dev/null
            test -s "installers/$file.sig" || { echo "::error::Signature absente ou vide : $file.sig"; exit 1; }
            mv "installers/$file.sig" updater/
          done
          ls -l updater

      - name: Générer latest.json
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # Même note de version que la release (rédigée dans la PR) ; vide en
          # secours, l'application renvoie alors vers la page de la release.
          node scripts/next-release-version.mjs --notes "$VERSION" > updater-notes.md || : > updater-notes.md
          cp installers/*.AppImage installers/*-setup.exe updater/
          node scripts/generate-updater-manifest.mjs \
            --version "$VERSION" --dist updater --notes updater-notes.md \
            --repo "$GITHUB_REPOSITORY" --out updater/latest.json
          node scripts/generate-updater-manifest.mjs check \
            --version "$VERSION" --dist updater --repo "$GITHUB_REPOSITORY"
          rm updater/*.AppImage updater/*-setup.exe
          cat updater/latest.json

      - name: Upload des signatures et du manifeste
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: syntheo-updater
          path: updater/
          retention-days: 14

  publish:
    name: Publication de la release
    needs: [detect, build, build-windows, sast, updater]
    if: |
      needs.detect.outputs.version != 'skipped'
      && github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.detect.outputs.version }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Une release publiée ne met jamais en ligne d'installeurs Windows non
      # signés : la signature se désactive d'elle-même hors release depuis
      # main ou sans secrets Azure (build-windows.yml), sans faire échouer le
      # build. Ce job ne tourne pas en dry_run.
      - name: Exiger des installeurs Windows signés
        shell: bash
        env:
          WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$WINDOWS_SIGNED" != "true" ]; then
            echo "::error::Signature Windows désactivée ou non vérifiée : vérifier github.workflow_ref (appel depuis release.yml sur main) et les secrets Azure transmis à build-windows. Publication annulée."
            exit 1
          fi
          echo "Installeurs Windows signés et vérifiés."

      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Télécharger les artefacts Linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-linux
          path: dist

      - name: Télécharger les artefacts Windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-desktop-windows
          path: dist

      - name: Télécharger les signatures de mise à jour et latest.json
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syntheo-updater
          path: dist

      - name: Contrôler latest.json
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # Version du tag, URL de chaque installeur présent dans dist/,
          # signatures non vides.
          node scripts/generate-updater-manifest.mjs check \
            --version "$VERSION" --dist dist --repo "$GITHUB_REPOSITORY"

      - name: Créer les alias d'assets stables
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          cd dist
          # Noms stables : `releases/latest/download/<nom>` reste valable à chaque release.
          cp "Syntheo_${v}_amd64.deb" "Syntheo-linux-amd64.deb"
          cp "Syntheo_${v}_amd64.AppImage" "Syntheo-linux-x86_64.AppImage"
          cp "Syntheo_${v}_x64-setup.exe" "Syntheo-windows-x64-setup.exe"
          cp "Syntheo_${v}_x64_en-US.msi" "Syntheo-windows-x64.msi"
          # Régénère les sommes en incluant les alias.
          rm -f SHA256SUMS SHA256SUMS-windows
          sha256sum ./*.deb ./*.AppImage ./*.msi ./*.exe ./latest.json > SHA256SUMS
          sha256sum ./*.msi ./*.exe > SHA256SUMS-windows
          cat SHA256SUMS SHA256SUMS-windows

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.deb, dist/*.AppImage, dist/*.msi, dist/*.exe, dist/latest.json"

      - name: Générer le CHANGELOG
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          # Description de la release : la note de version rédigée dans la PR
          # (packages/changelog/content/desktop/<version>.md, sans frontmatter,
          # exigée par la gate ci-changelog). Le git log ne sert qu'en secours.
          if node scripts/next-release-version.mjs --notes "$VERSION" > notes.md; then
            NOTES_FROM_FILE=true
          else
            echo "::warning::Note de version absente pour ${VERSION} : description tirée du git log."
            NOTES_FROM_FILE=false
          fi
          # Tag précédent, hors version publiée : une relance après création du
          # tag (voir la création du tag plus bas) ne doit pas vider le changelog.
          LAST_TAG=$(git tag -l 'v[0-9]*' --sort=-version:refname 2>/dev/null | grep -vxF "$VERSION" | head -1 || echo "")
          {
            if [ "$NOTES_FROM_FILE" = true ]; then
              cat notes.md
            else
              echo "## [${VERSION}] - $(date +%Y-%m-%d)"
              echo ""
              echo "### Changements depuis ${LAST_TAG:-le début}"
              echo ""
              git log "${LAST_TAG:+$LAST_TAG..}HEAD" --format="* %s"
            fi
            echo ""
            echo "Vérifier un paquet : \`sha256sum -c SHA256SUMS\` (Linux) ou \`Get-FileHash\` avec \`SHA256SUMS-windows\` (Windows), puis \`gh attestation verify <fichier> -R ${GITHUB_REPOSITORY}\`."
          } > changelog-tmp.md
          cat changelog-tmp.md

      - name: Créer le tag et la GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Jeton à grain fin (Contents et Workflows en écriture, ce seul dépôt),
          # utilisé uniquement pour créer le tag : GITHUB_TOKEN ne peut pas
          # avoir la permission Workflows, et GitHub refuse (403) un tag sur un
          # commit qui modifie .github/workflows depuis la release précédente.
          # Secret de l'environnement `production` (limité à main). Le jeton
          # expire le 2027-11-01 : le renouveler avant cette date.
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ needs.detect.outputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Le tag est créé explicitement sur le commit de release via l'API git
          # refs. On crée ensuite la release SANS `--target` : `target_commitish`
          # déclenche le même contrôle de scope « workflows ».
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} déjà présent."
          else
            if [ -z "${RELEASE_TOKEN}" ]; then
              echo "::warning::Secret RELEASE_TOKEN absent : création du tag avec GITHUB_TOKEN (échoue si des workflows ont changé)."
            fi
            GH_TOKEN="${RELEASE_TOKEN:-$GH_TOKEN}" gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${VERSION}" -f sha="${TARGET}" >/dev/null
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release ${VERSION} déjà présente : mise à jour des assets."
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* \
              --title "Syntheo Desktop $VERSION" \
              --notes-file changelog-tmp.md \
              --latest
          fi
          echo "✅ Release $VERSION publiée."

  notify-failure:
    name: Notification d'échec
    needs: [
      detect,
      gate-version-consistency,
      build,
      build-windows,
      sast,
      updater,
      publish,
    ]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Commenter l'échec sur la PR ou le commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.detect.outputs.version || 'inconnue' }}
          GATE: ${{ needs.gate-version-consistency.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          SAST: ${{ needs.sast.result }}
          UPDATER: ${{ needs.updater.result }}
          PUBLISH: ${{ needs.publish.result }}
        with:
          script: |
            const body = [
              `## ❌ Release échouée pour la version ${process.env.VERSION}`,
              '',
              `- **Gate version-consistency** : \`${process.env.GATE}\``,
              `- **Build** : \`${process.env.BUILD}\``,
              `- **Build Windows** : \`${process.env.WINDOWS}\``,
              `- **Gate SAST (CodeQL)** : \`${process.env.SAST}\``,
              `- **Signatures de mise à jour** : \`${process.env.UPDATER}\``,
              `- **Publish** : \`${process.env.PUBLISH}\``,
              '',
              `🔗 Run : ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            if (prs.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: prs[0].number, body });
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: context.sha, body });
            }
