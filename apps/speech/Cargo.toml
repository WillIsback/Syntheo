# Module de transcription sur le poste (issue 681, epic 631) : processus séparé
# lancé par l'application, qui parle le protocole temps réel de
# NeMo-Speech.cpp sur la boucle locale. Workspace à part : le moteur A
# (parakeet-rs) épingle une version d'ONNX Runtime différente de celle de
# l'application (`ort-sys` déclare `links`), et le module est construit par
# son propre workflow.
[workspace]

[package]
name = "syntheo-speech"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["parakeet"]
# Moteur A : parakeet-rs (ONNX Runtime), Nemotron 3.5 en flux et diarisation
# Nemotron-3.
parakeet = ["dep:parakeet-rs"]

[dependencies]
futures-util = "0.3.31"
hmac = "0.13"
parakeet-rs = { version = "=0.4.4", features = ["sortformer"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"

[dev-dependencies]
bytes = "1"
owhisper-client = { path = "../../crates/owhisper-client" }
owhisper-interface = { path = "../../crates/owhisper-interface" }
