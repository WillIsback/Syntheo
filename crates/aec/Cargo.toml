[package]
name = "aec"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["onnx", "128"]
onnx = ["dep:syntheo-onnx", "dep:sha2"]
# Téléchargement des modèles à la demande, pour l'application (issue 429).
download = ["onnx", "dep:reqwest", "dep:tokio"]
128 = []
256 = []
512 = []

[dependencies]
syntheo-onnx = { workspace = true, optional = true }

reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs"], optional = true }

realfft = { workspace = true }

serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
clap = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
dasp = { workspace = true }
hound = { workspace = true }
rodio = { workspace = true }
syntheo-audacity = { workspace = true }
syntheo-audio-snapshot = { workspace = true }
syntheo-audio-utils = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[[bench]]
name = "aec_bench"
harness = false
