[package]
name = "mesure"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reprise entre une synthèse générée et la version envoyée : calcul déterministe, sans IA, qui ne rend que des compteurs."

[dependencies]
serde = { workspace = true, features = ["derive"] }
similar = "2.7"
thiserror = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[features]
# Extraits des différences, pour le calibrage manuel par la CLI
# (`syntheo mesure --differences`). L'application ne l'active jamais.
differences = []
