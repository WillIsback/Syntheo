[package]
name = "speech-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
bytes = { workspace = true }
futures-util = { workspace = true }
owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
syntheo-image-hash = { workspace = true }
syntheo-pinned-fetch = { workspace = true }
syntheo-speech-probe = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
bytes = { workspace = true }
futures-util = { workspace = true }
owhisper-interface = { workspace = true }
syntheo-pinned-fetch = { workspace = true, features = ["test-loopback"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
