[package]
name = "speech-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
# Signature de manifestes pour les essais d'intégration ; jamais activée par
# l'application.
test-signing = ["dep:minisign"]

[dependencies]
owhisper-client = { workspace = true }
base64 = { workspace = true }
minisign = { version = "0.10", optional = true }
minisign-verify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
minisign = "0.10"
speech-host = { path = ".", features = ["test-signing"] }
bytes = { workspace = true }
futures-util = { workspace = true }
owhisper-interface = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
