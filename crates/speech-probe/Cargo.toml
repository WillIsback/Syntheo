[package]
name = "speech-probe"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, optional = true, features = ["derive"] }
sysinfo = { workspace = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Power"] }
