# cargo deny : advisories, licences, crates bannies, sources.
# Les exceptions (ignore) doivent figurer dans .github/security-exceptions.yml.

[graph]
all-features = false

[advisories]
# Crates non maintenues : seulement pour nos dépendances directes (les crates
# gtk-rs non maintenues tirées par Tauri sur Linux sont hors de notre portée).
unmaintained = "workspace"
yanked = "deny"
# Dette héritée d'Syntheo, recensée dans .github/security-exceptions.yml
# (expiration 2027-01-31). Chaque entrée disparaît avec le chantier indiqué.
ignore = [
  # Outils de build et de test, absents du binaire livré.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml : wayland-scanner (génération au build) et plist/citationberg (fichiers locaux) ; à suivre en amont" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml : wayland-scanner (génération au build) et plist/citationberg (fichiers locaux) ; à suivre en amont" },
  # Crates non maintenues sans faille connue ni version corrigée (avis du 2026-11-17).
  { id = "RUSTSEC-2026-0543", reason = "chrono / chrono-tz non maintenus, sans faille connue : remplacement suivi dans l'issue 595 (expire 2027-01-31)" },
  { id = "RUSTSEC-2026-0555", reason = "chrono / chrono-tz non maintenus, sans faille connue : remplacement suivi dans l'issue 595 (expire 2027-01-31)" },
  # Plateformes non livrées ou dépendances de Tauri.
  { id = "RUSTSEC-2024-0429", reason = "glib 0.18 (gtk-rs) tiré par Tauri sur Linux : en attente de la migration GTK4 de Tauri" },
  { id = "RUSTSEC-2024-0422", reason = "gtk-layer-shell 0.8 (GTK3) : pastille de réunion en calque Wayland (issue 448), suit gtk-rs 0.18 de Tauri jusqu'à sa migration GTK4" },
  # SQLite embarqué (libsqlite3-sys 0.35 via sqlx-sqlite 0.9.0 et db-core) : correctif en
  # libsqlite3-sys 0.39.0, que sqlx 0.9.0 refuse (borne < 0.38, lien « sqlite3 » unique).
  # Borne relevée en amont mais non publiée. Exception courte (expire 2026-12-09),
  # à lever avec la prochaine version de sqlx (issue 490).
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.35 via sqlx-sqlite 0.9.0 : correctif 0.39 refusé par sqlx 0.9.0, en attente de sqlx (expire 2026-12-09)" },
]

[licenses]
# Politique : pas de copyleft fort (GPL, AGPL, SSPL).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "Unlicense",
  "LGPL-2.1-or-later",
  "NCSA",
]
confidence-threshold = 0.9
# Crates internes non publiées.
private = { ignore = true }

# Encodeur MP3 de l'enregistrement audio : supprimé avec la règle « aucun audio
# sur disque » (chantier 04c). Exception datée dans .github/security-exceptions.yml.
[[licenses.exceptions]]
crate = "mp3lame-encoder"
allow = ["LGPL-3.0"]

[[licenses.exceptions]]
crate = "mp3lame-sys"
allow = ["LGPL-3.0"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
# Dépendances git héritées : avertissement, à épingler ou remplacer au fil des chantiers.
unknown-git = "warn"
