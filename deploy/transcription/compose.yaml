# Service de transcription local pour Syntheo : NVIDIA NeMo-Speech.cpp
# (Apache-2.0) avec Nemotron 3.5 ASR Streaming et Nemotron 3 Diarization
# (licence OpenMDW-1.1), modèles intégrés à l'image. Voir la page « Installer
# le service de transcription en local » de la documentation.
#
#   docker compose --profile gpu up -d    # carte NVIDIA (NVIDIA Container Toolkit)
#   docker compose --profile cpu up -d    # processeur seul
#
# Image publiée par défaut (ghcr.io/willisback/syntheo-transcription). Pour la
# construire depuis les sources, depuis la racine du dépôt :
#   docker buildx bake -f deploy/transcription/docker-bake.hcl cuda --load
#   NEMO_SPEECH_IMAGE=syntheo-transcription docker compose --profile gpu up -d
#
# Le service n'écoute que sur cette machine (127.0.0.1) par défaut : dans
# Syntheo, adresse http://localhost:9000, protocole « NVIDIA NeMo-Speech.cpp ».

name: syntheo-transcription

x-nemo-speech: &nemo-speech
  restart: unless-stopped
  environment:
    # Vide : pas de clé (le service n'écoute que sur cette machine).
    NEMO_SPEECH_HTTP_API_KEY: ${ASR_API_KEY:-}
  # Commande par défaut de l'image : serve --endpointing, modèles de /models.
  ports:
    - "${NEMO_SPEECH_BIND:-127.0.0.1}:${NEMO_SPEECH_PORT:-9000}:8080"

services:
  nemo-speech-gpu:
    <<: *nemo-speech
    profiles: [gpu]
    image: ${NEMO_SPEECH_IMAGE:-ghcr.io/willisback/syntheo-transcription}:${NEMO_SPEECH_TAG:-0.3.0}-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  nemo-speech-cpu:
    <<: *nemo-speech
    profiles: [cpu]
    image: ${NEMO_SPEECH_IMAGE:-ghcr.io/willisback/syntheo-transcription}:${NEMO_SPEECH_TAG:-0.3.0}-cpu
