[package]
name = "tauri-plugin-detect"
version = "0.1.0"
authors = ["You"]
edition = "2024"
exclude = ["/js", "/node_modules"]
license = "MIT"
links = "tauri-plugin-detect"
description = ""

[features]
default = ["zoom", "sleep"]
zoom = ["syntheo-detect/zoom"]
language = ["syntheo-detect/language"]
sleep = ["syntheo-detect/sleep"]
test-support = []

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
syntheo-detect = { workspace = true, features = ["mic"] }
syntheo-specta-export = { workspace = true }
tauri = { workspace = true, features = ["test"] }
tauri-plugin-detect = { path = ".", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[dependencies]
syntheo-detect = { workspace = true, features = ["mic", "list", "language", "sleep", "screen"] }
syntheo-notification-interface = { workspace = true }

tauri = { workspace = true, features = ["specta"] }
tauri-plugin-windows = { workspace = true }

specta = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
