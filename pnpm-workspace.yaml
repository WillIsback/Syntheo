  "esbuild@<0.25.0": "0.25.12"
  "esbuild@>=0.27.3 <0.28.1": "0.28.1"
  "katex@>=0.11.0 <0.18.2": "0.18.2"
  "lodash@<4.18.1": "4.18.1"
  "mermaid@>=11.0.0 <11.16.1": "11.17.2"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "tinypool@<2.1.2": "2.1.2"
  "undici@>=6.0.0 <6.29.1": "6.29.1"
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "uuid@<11.1.1": "11.1.1"

peerDependencyRules:
  allowedVersions:
    motion: "11"
    react: "19"
    "@lobehub/ui": "3.4.0"
    unist-util-visit: "5"
    esbuild: "0.25"

allowBuilds:
  "@parcel/watcher": true
  dprint: true
  esbuild: true

patchedDependencies:
  # Embed React Scan history, prompts, and inspector in the developer bar.
  react-scan@0.5.7: patches/react-scan@0.5.7.patch
  braces@3.0.3: patches/braces@3.0.3.patch
