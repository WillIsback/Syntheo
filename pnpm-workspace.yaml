  prosemirror-transform: "1.12.4"
  prosemirror-view: "1.42.3"
  lightningcss: "1.30.1"
  seroval: "1.7.5"
  seroval-plugins: "1.7.5"
  "@humanfs/node@<0.16.8": "0.16.8"
  "@babel/core@<7.29.7": "7.29.7"
  "@ai-sdk/provider-utils@>=4.0.0-beta.10 <4.0.33": "4.0.33"
  "@opentelemetry/core@>=2.0.0 <2.8.0": "2.8.0"
  "@tanstack/react-router@<1.169.2": "1.169.2"
  "@tanstack/router-core@<1.169.2": "1.169.2"
  "@ungap/structured-clone@<1.3.1": "1.3.1"
  "baseline-browser-mapping@<2.11.0": "2.11.0"
  "brace-expansion@<1.1.21": "1.1.21"
  "brace-expansion@>=2.0.0 <2.1.7": "2.1.7"
  "minimatch@>=9.0.0 <11.0.1": "11.0.3"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
